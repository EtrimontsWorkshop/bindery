name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Tag matches the manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('packages/module/module.json', 'utf8')).version")
          if [ "$TAG" != "v$VERSION" ]; then
            # The release's files carry the manifest's version (file names, download link): a tag that says
            # something else would publish a release whose link points at a tag that does not exist.
            echo "::error::Tag $TAG does not match packages/module/module.json version $VERSION (expected v$VERSION)."
            exit 1
          fi

      - run: npm ci

      - name: Build (core + module)
        run: npm run build:dist

      - name: Typecheck (packages/module)
        run: npm run typecheck --workspace=packages/module

      - name: Test
        run: npm run test

      - name: Boundary gate
        run: npm run check:boundary

      - name: Bare module specifier gate
        run: npm run check:imports

      - name: Startup bundle size gate
        run: npm run check:size

      - name: Package module.zip
        run: npm run package

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A release for this tag already exists (for example it was created in the GitHub UI):
            # attach the built files to it, replacing anything uploaded by hand.
            gh release upload "$TAG" packages/module/dist/module.json module.zip --clobber
          else
            gh release create "$TAG" \
              packages/module/dist/module.json \
              module.zip \
              --title "$TAG" \
              --generate-notes
          fi
